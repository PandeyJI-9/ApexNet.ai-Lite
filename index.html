<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexNet.lite cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Dark Theme Background */
        body { background-color: #0b111e; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        /* Hide Default Details Marker */
        .thinking-box summary::-webkit-details-marker { display: none; }
        .thinking-box summary { list-style: none; }
        
        /* Input Area Color */
        .input-bg { background-color: #151e2e; }
        .bot-msg-bg { background-color: #101726; }
    </style>
</head>
<body class="text-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header (Exact Match) -->
    <header class="bg-[#0b111e] border-b border-gray-800 p-4 flex justify-between items-center z-10">
        <!-- Hamburger Icon -->
        <button class="text-gray-400 hover:text-white transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        
        <!-- Updated Title -->
        <h1 class="text-md font-semibold text-white tracking-wide">
            ApexNet.lite cloud
        </h1>
        
        <!-- Plus Icon -->
        <button onclick="clearChat()" class="text-blue-500 hover:text-blue-400 transition" title="New Chat">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
    </header>

    <!-- Chat Box -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 pb-28 flex flex-col">
        <!-- Welcome Message -->
        <div class="flex justify-start">
            <div class="bot-msg-bg border border-gray-800 rounded-2xl rounded-bl-none p-4 max-w-[85%] md:max-w-[70%] shadow-md">
                <p class="text-gray-300 text-sm leading-relaxed">RAM RAM Bhai! Main ApexNet.lite hu. Bol kya deploy karna hai aaj? 🚀</p>
            </div>
        </div>
    </main>

    <!-- Footer & Input Area -->
    <footer class="bg-[#0b111e] p-4 absolute bottom-0 w-full border-t border-gray-800/50">
        <!-- Tera VIP Disclaimer -->
        <p class="text-[10px] text-gray-500 text-center mb-3">
            ApexNet.lite is lite AI so it makes more mistakes
        </p>
        
        <form id="chat-form" class="max-w-4xl mx-auto flex items-end gap-2 input-bg rounded-3xl p-1.5 border border-gray-700/50 focus-within:border-blue-500/50 transition-colors">
            <input 
                type="text" 
                id="user-input" 
                class="flex-1 bg-transparent px-4 py-2.5 text-sm focus:outline-none placeholder-gray-500 text-gray-200" 
                placeholder="Deploy commands..." 
                required 
                autocomplete="off"
            >
            <!-- Send Button -->
            <button 
                type="submit" 
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-full transition-all flex items-center justify-center m-0.5"
            >
                <svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
            </button>
        </form>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // 🚨 YAHAN APNA RENDER WALA LINK DAALNA 🚨
        const BACKEND_URL = "https://apexnet-ai-lite.onrender.com/chat";
        const DEFAULT_CHAT_ID = "lite_session_1"; 
        
        const FAKE_TOKEN = "token_test_123"; 

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sendIcon = `<svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>`;
        const spinnerIcon = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;

        function appendMessage(role, text, thinking = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            let innerHTML = '';
            
            if (role === 'user') {
                innerHTML = `
                    <div class="bg-blue-600 text-white text-sm px-4 py-3 rounded-2xl rounded-br-none max-w-[85%] md:max-w-[70%] shadow-md">
                        <p>${text}</p>
                    </div>
                `;
            } else {
                let thinkingHTML = '';
                if (thinking) {
                    thinkingHTML = `
                        <details class="thinking-box mb-3 bg-[#080d16] border border-gray-800 rounded-lg overflow-hidden">
                            <summary class="text-xs text-blue-400 p-2.5 hover:bg-gray-800/50 transition flex items-center gap-2 cursor-pointer font-medium">
                                <span class="text-[10px] text-gray-500">▶</span> 🧠 View Process
                            </summary>
                            <div class="p-3 text-[11px] text-gray-500 font-mono whitespace-pre-wrap border-t border-gray-800/50 leading-relaxed">${thinking}</div>
                        </details>
                    `;
                }
                
                innerHTML = `
                    <div class="bot-msg-bg border border-gray-800 rounded-2xl rounded-bl-none p-4 max-w-[90%] md:max-w-[75%] shadow-md">
                        ${thinkingHTML}
                        <p class="text-gray-300 text-sm whitespace-pre-wrap leading-relaxed">${text}</p>
                    </div>
                `;
            }
            
            msgDiv.innerHTML = innerHTML;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearChat() {
            chatBox.innerHTML = '';
            appendMessage('bot', 'Memory cleared! Naya sawal phailo bhai. 🧹');
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.innerHTML = spinnerIcon;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${FAKE_TOKEN}`
                    },
                    body: JSON.stringify({
                        chat_id: DEFAULT_CHAT_ID,
                        prompt: message
                    })
                });

                if (!response.ok) throw new Error("Connection Error. Backend Sleeping.");

                const data = await response.json();
                appendMessage('bot', data.answer, data.thinking);
                
            } catch (error) {
                // UI matching the error screenshot
                appendMessage('bot', '🚨 ' + error.message);
            } finally {
                userInput.disabled = false;
                userInput.focus();
                sendBtn.innerHTML = sendIcon;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    </script>
</body>
</html>
