<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexNet.Lite Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Advanced Logic: Markdown & Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* Custom Hacker Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        
        .thinking-box summary { cursor: pointer; user-select: none; }
        .thinking-box summary::-webkit-details-marker { display: none; }
        
        /* Markdown Code Styles */
        pre { background: #1a1b26; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 10px 0; border: 1px solid #374151;}
        code { font-family: 'Courier New', Courier, monospace; }
        .markdown-body p { margin-bottom: 8px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans selection:bg-blue-500 selection:text-white">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-lg flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
                ApexNet.Lite Cloud
            </h1>
        </div>
        <button onclick="clearHistory()" class="text-xs bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-lg transition-all border border-red-500/30">
            🗑️ Clear Memory
        </button>
    </header>

    <!-- Chat Box -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 scroll-smooth pb-32">
        <!-- Messages will be injected here by JS -->
    </main>

    <!-- Footer & Input Area -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4 absolute bottom-0 w-full">
        <!-- Tera VIP Disclaimer -->
        <p class="text-[11px] text-gray-400 text-center mb-3 tracking-wide">
            ⚠️ <span class="font-semibold text-blue-400">ApexNet.Lite</span> is a lite AI so it makes more mistakes. Handle with code!
        </p>
        
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2 relative">
            <input 
                type="text" 
                id="user-input" 
                class="flex-1 bg-gray-900 border border-gray-600 rounded-xl pl-4 pr-12 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-gray-500 shadow-inner" 
                placeholder="Command ApexNet.Lite..." 
                required 
                autocomplete="off"
            >
            <button 
                type="submit" 
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold transition-all transform active:scale-95 shadow-[0_0_15px_rgba(37,99,235,0.4)] flex items-center justify-center min-w-[100px]"
            >
                Send
            </button>
        </form>
    </footer>

    <!-- Advanced JavaScript Logic -->
    <script>
        // Set marked.js options for Syntax Highlighting
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        const BACKEND_URL = "https://apexnet-ai-lite.onrender.com/chat"; 
        const FAKE_TOKEN = "token_test_123"; 

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // 🔥 Advanced Logic 1: Local Storage Session Management
        let chatHistory = JSON.parse(localStorage.getItem('apex_lite_chats')) || [
            { role: 'bot', text: 'Hello Bhai! Main ApexNet.Lite hu. Bol kya ukhadna hai aaj? 🚀', thinking: null }
        ];

        function renderHistory() {
            chatBox.innerHTML = '';
            chatHistory.forEach(msg => appendMessageUI(msg.role, msg.text, msg.thinking, false));
        }

        function saveHistory() {
            localStorage.setItem('apex_lite_chats', JSON.stringify(chatHistory));
        }

        function clearHistory() {
            if(confirm("Bhai sach me sab udana hai?")) {
                localStorage.removeItem('apex_lite_chats');
                chatHistory = [{ role: 'bot', text: 'Memory cleared! Naya sawal phailo bhai. 🧹', thinking: null }];
                renderHistory();
            }
        }

        // 🔥 Advanced Logic 2: Dynamic UI Appender with Markdown & Code Highlight
        function appendMessageUI(role, text, thinking = null, typewrite = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`;
            
            let innerHTML = '';
            
            if (role === 'user') {
                innerHTML = `
                    <div class="bg-blue-600 text-white rounded-2xl rounded-tr-none p-4 max-w-[85%] md:max-w-[70%] shadow-lg">
                        <p class="whitespace-pre-wrap">${text}</p>
                    </div>
                `;
                msgDiv.innerHTML = innerHTML;
                chatBox.appendChild(msgDiv);
                scrollToBottom();
            } else {
                let thinkingHTML = '';
                if (thinking) {
                    thinkingHTML = `
                        <details class="thinking-box mb-3 bg-gray-900 border border-gray-700 rounded-lg overflow-hidden shadow-inner">
                            <summary class="text-xs text-gray-400 p-2 hover:bg-gray-800 transition flex items-center gap-2">
                                <span>🧠</span> View Backend Process
                            </summary>
                            <div class="p-3 text-[11px] text-gray-500 font-mono whitespace-pre-wrap border-t border-gray-700 leading-relaxed">${thinking}</div>
                        </details>
                    `;
                }
                
                innerHTML = `
                    <div class="bg-gray-800 border border-gray-700 rounded-2xl rounded-tl-none p-4 max-w-[90%] md:max-w-[75%] shadow-lg">
                        ${thinkingHTML}
                        <div class="text-gray-200 leading-relaxed markdown-body response-content"></div>
                    </div>
                `;
                msgDiv.innerHTML = innerHTML;
                chatBox.appendChild(msgDiv);
                
                const contentBox = msgDiv.querySelector('.response-content');
                
                // 🔥 Advanced Logic 3: Typewriter Effect
                if (typewrite) {
                    let i = 0;
                    contentBox.innerHTML = '<span class="animate-pulse">|</span>'; // Cursor
                    const rawHTML = marked.parse(text);
                    
                    // Simple text typing simulation (To prevent breaking HTML tags)
                    contentBox.innerHTML = rawHTML; 
                    contentBox.style.opacity = 0;
                    
                    let fade = 0;
                    let fadeInterval = setInterval(() => {
                        fade += 0.1;
                        contentBox.style.opacity = fade;
                        if(fade >= 1) clearInterval(fadeInterval);
                    }, 30);
                    
                } else {
                    contentBox.innerHTML = marked.parse(text);
                }
                scrollToBottom();
            }
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Initialize UI
        renderHistory();

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // UI Update & Save
            appendMessageUI('user', message);
            chatHistory.push({ role: 'user', text: message, thinking: null });
            saveHistory();

            userInput.value = '';
            userInput.disabled = true;
            sendBtn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${FAKE_TOKEN}` },
                    body: JSON.stringify({ chat_id: "lite_session_local", prompt: message })
                });

                if (!response.ok) throw new Error("Backend thak gaya ya so raha hai!");

                const data = await response.json();
                
                // UI Update with Typewriter & Save
                appendMessageUI('bot', data.answer, data.thinking, true);
                chatHistory.push({ role: 'bot', text: data.answer, thinking: data.thinking });
                saveHistory();
                
            } catch (error) {
                appendMessageUI('bot', '🚨 Error aagaya bhai: ' + error.message, null, false);
            } finally {
                userInput.disabled = false;
                userInput.focus();
                sendBtn.innerHTML = 'Send';
                scrollToBottom();
            }
        });
    </script>
</body>
</html>
