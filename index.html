<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexNet.lite cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Scrollbar for Hacker Vibe */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        
        .thinking-box summary { cursor: pointer; user-select: none; }
        .thinking-box summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-lg flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
                ApexNet.lite cloud
            </h1>
        </div>
        <button onclick="clearChat()" class="text-sm text-gray-400 hover:text-red-400 transition">Clear Chat</button>
    </header>

    <!-- Chat Box -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 pb-24">
        <!-- Welcome Message -->
        <div class="flex justify-start">
            <div class="bg-gray-800 border border-gray-700 rounded-2xl rounded-tl-none p-4 max-w-[85%] md:max-w-[70%] shadow-md">
                <p>Hello Bhai! Main ApexNet.lite hu. Bol kya deploy karna hai aaj? 🚀</p>
            </div>
        </div>
    </main>

    <!-- Footer & Input Area -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4 absolute bottom-0 w-full">
        <!-- Tera VIP Disclaimer -->
        <p class="text-[11px] text-gray-400 text-center mb-3">
            ⚠️ ApexNet.lite is a lite AI so it makes more mistakes. Handle with code!
        </p>
        
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                class="flex-1 bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-all placeholder-gray-500" 
                placeholder="Message ApexNet.lite..." 
                required 
                autocomplete="off"
            >
            <button 
                type="submit" 
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-semibold transition-all min-w-[100px]"
            >
                Send
            </button>
        </form>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // 🚨 YAHAN APNA RENDER WALA LINK CHECK KAR LENA 🚨
        const BACKEND_URL = "https://apexnet-ai-lite.onrender.com/chat";
        const DEFAULT_CHAT_ID = "lite_session_1"; 
        
        // Agar tune UI me login page alag rakha hai, toh wahan se localStorage me token save karke yahan nikal lena.
        const FAKE_TOKEN = "token_test_123"; 

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(role, text, thinking = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            let innerHTML = '';
            
            if (role === 'user') {
                innerHTML = `
                    <div class="bg-blue-600 text-white rounded-2xl rounded-tr-none p-4 max-w-[85%] md:max-w-[70%] shadow-md">
                        <p>${text}</p>
                    </div>
                `;
            } else {
                let thinkingHTML = '';
                if (thinking) {
                    thinkingHTML = `
                        <details class="thinking-box mb-3 bg-gray-900 border border-gray-700 rounded-lg overflow-hidden">
                            <summary class="text-xs text-gray-400 p-2 hover:bg-gray-800 transition flex items-center gap-2">
                                <span>🧠</span> View Backend Process
                            </summary>
                            <div class="p-3 text-[11px] text-gray-500 font-mono whitespace-pre-wrap border-t border-gray-700">${thinking}</div>
                        </details>
                    `;
                }
                
                innerHTML = `
                    <div class="bg-gray-800 border border-gray-700 rounded-2xl rounded-tl-none p-4 max-w-[85%] md:max-w-[70%] shadow-md">
                        ${thinkingHTML}
                        <p class="text-gray-200 whitespace-pre-wrap">${text}</p>
                    </div>
                `;
            }
            
            msgDiv.innerHTML = innerHTML;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearChat() {
            chatBox.innerHTML = '';
            appendMessage('bot', 'Memory cleared! Naya sawal phailo bhai. 🧹');
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${FAKE_TOKEN}`
                    },
                    body: JSON.stringify({
                        chat_id: DEFAULT_CHAT_ID,
                        prompt: message
                    })
                });

                if (!response.ok) throw new Error("Backend thak gaya ya so raha hai!");

                const data = await response.json();
                appendMessage('bot', data.answer, data.thinking);
                
            } catch (error) {
                appendMessage('bot', '🚨 Error aagaya bhai: ' + error.message);
            } finally {
                userInput.disabled = false;
                userInput.focus();
                sendBtn.innerHTML = 'Send';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    </script>
</body>
</html>
